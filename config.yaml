# ===================================================================================
# config.yaml 
# contains configurable parameters for the pipeline. 
# note, however, that some parameters may be overwritten by the values in samples.tsv.
# in those cases, this file acts as the default values.
# to further understand this, refer to README.md 
# ===================================================================================

# pra fazer: conferir se tem sentido deixar os valores aqui como default - 
# seria aceito deixar esses valores em branco em samples.tsv?

fastp:
  qual_threshold: 20
  min_length: 50

spades:
  mode: "--isolate"  # default, but gets overwritten by samples.tsv
# mode: "--careful" 

filtering:
  min_contig_length: 500

busco:
  lineage: "saccharomycetes_odb10"  # default, but gets overwritten by samples.tsv
# lineage: "ascomycota_odb10"
# lineage: "basidiomycota_odb10"
# lineage: "fungi_odb10"

kraken2:
  db: "data/dbs/kraken2"
  mem: "--memory-mapping" # if there's enough RAM (>16gb), can be changed to ""

host_references:
  human: "data/dbs/human/Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz"

# most up-to-date biocontainers versions obtained at https://quay.io/search
containers:
  fastp: "docker://quay.io/biocontainers/fastp:1.3.6--h43da1c4_0"
  hostile: "docker://quay.io/biocontainers/hostile:2.0.2--pyhdfd78af_0"
  seqtk: "docker://quay.io/biocontainers/seqtk:1.5--h577a1d6_1"
  spades: "docker://quay.io/biocontainers/spades:4.3.0--hde4eca7_1"
  ragtag: "docker://quay.io/biocontainers/ragtag:2.1.0--pyhdfd78af_2"
  kraken2: "docker://quay.io/biocontainers/kraken2:2.17.1--pl5321h077b44d_0"
  quast: "docker://quay.io/biocontainers/quast:5.3.0--py313pl5321h5ca1c30_2"
  busco: "docker://quay.io/biocontainers/busco:5.7.1--pyhdfd78af_0"
  multiqc: "docker://quay.io/biocontainers/multiqc:1.35--pyhdfd78af_1"
  pypolca: "docker://quay.io/biocontainers/pypolca:0.4.0--pyhdfd78af_0"
  getorganelle: "docker://quay.io/biocontainers/getorganelle:1.7.7.1--pyhdfd78af_0"